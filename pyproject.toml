[project]
name = "logimu-shopping-mcp"
version = "1.1.0"
description = "Logimu Shopping MCP — real Amazon (US/UK/DE/CA/AU) & Walmart shopping data for Claude, ChatGPT, and any MCP client. Hosted at https://api.logimu.com/mcp (free, no signup: 30 queries/day)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
logimu-mcp-stub = "logimu_mcp.stub:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
